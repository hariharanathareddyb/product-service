name: Build and deploy product-service

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and package
        run: mvn --batch-mode clean verify

  deploy:
    name: Publish image and deploy to ECS
    needs: verify
    # Enable this after the ECS service and GitHub OIDC role are configured.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show OIDC subject and audience for trust-policy troubleshooting
        shell: bash
        run: |
          token_json="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$token_json")"
          OIDC_TOKEN="$token" python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["OIDC_TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({"sub": claims.get("sub"), "aud": claims.get("aud")}, indent=2))
          PY

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build --tag "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition with the new image
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-definition.json
          container-name: product-service
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
